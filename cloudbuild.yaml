# Cloud Build configuration for HustStay Backend
# This file configures automatic builds when pushing to GitHub

substitutions:
  _REGION: asia-southeast1
  _REPO: huststay-repo

steps:
  # Ensure Artifact Registry repository exists before any push
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if ! gcloud artifacts repositories describe "${_REPO}" --location="${_REGION}" >/dev/null 2>&1; then
          gcloud artifacts repositories create "${_REPO}" \
            --location="${_REGION}" \
            --repository-format=docker \
            --description="HustStay Docker images"
        fi
    id: 'ensure-artifact-repo'

  # Enable APIs required by Cloud Run deployments that consume Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud services enable secretmanager.googleapis.com --project="$PROJECT_ID"
    id: 'enable-secret-manager-api'
    waitFor: ['ensure-artifact-repo']

  # ========== BUILD ALL SERVICES ==========
  
  # Build User Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-service:latest', './user-service']
    id: 'build-user-service'
    waitFor: ['-']

  # Build Hotel Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hotel-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hotel-service:latest', './hotel-service']
    id: 'build-hotel-service'
    waitFor: ['-']

  # Build Room Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/room-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/room-service:latest', './room-service']
    id: 'build-room-service'
    waitFor: ['-']

  # Build Booking Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/booking-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/booking-service:latest', './booking-service']
    id: 'build-booking-service'
    waitFor: ['-']

  # Build Payment Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/payment-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/payment-service:latest', './payment-service']
    id: 'build-payment-service'
    waitFor: ['-']

  # Build Review Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/review-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/review-service:latest', './review-service']
    id: 'build-review-service'
    waitFor: ['-']

  # Build API Gateway (last - after all services)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-gateway:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-gateway:latest', './api-gateway']
    id: 'build-api-gateway'
    waitFor: ['build-user-service', 'build-hotel-service', 'build-room-service', 'build-booking-service', 'build-payment-service', 'build-review-service']

  # ========== PUSH ALL IMAGES ==========
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-gateway']
    id: 'push-api-gateway'
    waitFor: ['build-api-gateway', 'ensure-artifact-repo']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-service']
    id: 'push-user-service'
    waitFor: ['build-user-service', 'ensure-artifact-repo']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hotel-service']
    id: 'push-hotel-service'
    waitFor: ['build-hotel-service', 'ensure-artifact-repo']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/room-service']
    id: 'push-room-service'
    waitFor: ['build-room-service', 'ensure-artifact-repo']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/booking-service']
    id: 'push-booking-service'
    waitFor: ['build-booking-service', 'ensure-artifact-repo']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/payment-service']
    id: 'push-payment-service'
    waitFor: ['build-payment-service', 'ensure-artifact-repo']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/review-service']
    id: 'push-review-service'
    waitFor: ['build-review-service', 'ensure-artifact-repo']

  # ========== DEPLOY TO CLOUD RUN ==========

  # Recreate User Service to avoid stale env var typing from prior revisions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
    - '-c'
    - |
      gcloud run services delete user-service \
        --project=$PROJECT_ID \
        --region=${_REGION} \
        --quiet || true
    id: 'delete-user-service'
    waitFor: ['push-user-service']

  # Deploy User Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'user-service'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-service:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--set-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false,DB_URL=jdbc:postgresql://34.142.184.250:5432/user_service,DB_USERNAME=postgres,DB_PASSWORD=18052004,JWT_SECRET=secret123'
    id: 'deploy-user-service'
    waitFor: ['delete-user-service']

  # Clear stale env vars for Hotel Service before redeploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
    - '-c'
    - |
      gcloud run services update hotel-service \
        --project=$PROJECT_ID \
        --region=${_REGION} \
        --clear-env-vars || true
    id: 'clear-hotel-service-env'
    waitFor: ['push-hotel-service']

  # Deploy Hotel Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'hotel-service'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hotel-service:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--update-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false,DB_URL=jdbc:postgresql://34.142.184.250:5432/hotel_service,DB_USERNAME=postgres,DB_PASSWORD=18052004'
    - '--update-env-vars=ROOM_SERVICE_URL=https://room-service-310906765270.asia-southeast1.run.app'
    - '--update-env-vars=REVIEW_SERVICE_URL=https://review-service-310906765270.asia-southeast1.run.app'
    id: 'deploy-hotel-service'
    waitFor: ['clear-hotel-service-env']

  # Recreate Room Service to avoid stale env var typing from prior revisions
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
    - '-c'
    - |
      gcloud run services delete room-service \
        --project=$PROJECT_ID \
        --region=${_REGION} \
        --quiet || true
    id: 'delete-room-service'
    waitFor: ['push-room-service']

  # Deploy Room Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'room-service'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/room-service:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--set-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false,DB_URL=jdbc:postgresql://34.142.184.250:5432/room_service,DB_USERNAME=postgres,DB_PASSWORD=18052004'
    - '--set-env-vars=HOTEL_SERVICE_URL=https://hotel-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=BOOKING_SERVICE_URL=https://booking-service-310906765270.asia-southeast1.run.app'
    id: 'deploy-room-service'
    waitFor: ['delete-room-service']

  # Clear stale env vars for Booking Service before redeploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
    - '-c'
    - |
      gcloud run services update booking-service \
        --project=$PROJECT_ID \
        --region=${_REGION} \
        --clear-env-vars || true
    id: 'clear-booking-service-env'
    waitFor: ['push-booking-service']

  # Deploy Booking Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'booking-service'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/booking-service:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--set-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false,DB_URL=jdbc:postgresql://34.142.184.250:5432/booking_service,DB_USERNAME=postgres,DB_PASSWORD=18052004,GOOGLE_CLIENT_ID=client-id,GOOGLE_CLIENT_SECRET=client-secret'
    - '--set-env-vars=HOTEL_SERVICE_URL=https://hotel-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=USER_SERVICE_URL=https://user-service-310906765270.asia-southeast1.run.app'
    id: 'deploy-booking-service'
    waitFor: ['clear-booking-service-env']

  # Clear stale env vars for Payment Service before redeploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
    - '-c'
    - |
      gcloud run services update payment-service \
        --project=$PROJECT_ID \
        --region=${_REGION} \
        --clear-env-vars || true
    id: 'clear-payment-service-env'
    waitFor: ['push-payment-service']

  # Deploy Payment Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'payment-service'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/payment-service:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--update-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false,DB_URL=jdbc:postgresql://34.142.184.250:5432/payment_service,DB_USERNAME=postgres,DB_PASSWORD=18052004'
    - '--update-env-vars=BOOKING_SERVICE_URL=https://booking-service-310906765270.asia-southeast1.run.app'
    id: 'deploy-payment-service'
    waitFor: ['clear-payment-service-env']

  # Clear stale env vars for Review Service before redeploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
    - '-c'
    - |
      gcloud run services update review-service \
        --project=$PROJECT_ID \
        --region=${_REGION} \
        --clear-env-vars || true
    id: 'clear-review-service-env'
    waitFor: ['push-review-service']

  # Deploy Review Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'review-service'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/review-service:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--update-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false,DB_URL=jdbc:postgresql://34.142.184.250:5432/review_service,DB_USERNAME=postgres,DB_PASSWORD=18052004'
    - '--update-env-vars=USER_SERVICE_URL=https://user-service-310906765270.asia-southeast1.run.app'
    - '--update-env-vars=HOTEL_SERVICE_URL=https://hotel-service-310906765270.asia-southeast1.run.app'
    id: 'deploy-review-service'
    waitFor: ['clear-review-service-env']

  # Deploy API Gateway (last - depends on all services)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'api-gateway'
    - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-gateway:$SHORT_SHA'
    - '--region=${_REGION}'
    - '--platform=managed'
    - '--port=8080'
    - '--memory=1Gi'
    - '--timeout=600'
    - '--set-env-vars=SERVER_PORT=8080,EUREKA_CLIENT_ENABLED=false'
    - '--set-env-vars=SERVICES_USER_SERVICE=https://user-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=SERVICES_HOTEL_SERVICE=https://hotel-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=SERVICES_ROOM_SERVICE=https://room-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=SERVICES_BOOKING_SERVICE=https://booking-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=SERVICES_PAYMENT_SERVICE=https://payment-service-310906765270.asia-southeast1.run.app'
    - '--set-env-vars=SERVICES_REVIEW_SERVICE=https://review-service-310906765270.asia-southeast1.run.app'
    id: 'deploy-api-gateway'
    waitFor: ['push-api-gateway', 'deploy-user-service', 'deploy-hotel-service', 'deploy-room-service']

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-gateway:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/hotel-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/room-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/booking-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/payment-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/review-service:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '3600s'
